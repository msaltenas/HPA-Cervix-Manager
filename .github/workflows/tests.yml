name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      - name: Test
        # Only fixture-based tests run here (tests/). No real HPA network
        # calls happen in CI -- see scripts/bootstrap_test.py, which is a
        # manual, local-only verification script and is not invoked here.
        run: pytest -v
